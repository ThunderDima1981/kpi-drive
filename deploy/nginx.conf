server {
    listen 80;
    server_name mbo.raz2va.ru;
    return 301 https://mbo.raz2va.ru$request_uri;
}

server {
    listen 443 ssl;
    server_name mbo.raz2va.ru;

    ssl_certificate /etc/letsencrypt/live/mbo.raz2va.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mbo.raz2va.ru/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/kpi-drive/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:4327;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
